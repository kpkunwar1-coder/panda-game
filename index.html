<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Adventure</title>
    <style>
        body { background: #000; color: white; text-align: center; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        .game-container { max-width: 500px; margin: auto; position: relative; height: 100vh; background: #1a1a1a; }
        .screen { display: none; width: 100%; height: 100%; position: relative; }
        .active { display: block; }
        img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Map Hitboxes */
        .hitbox { position: absolute; cursor: pointer; z-index: 100; }

        /* Match-3 Grid Area */
        #game-ui {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; background: rgba(0,0,0,0.8); border: 4px solid #7ca852;
            border-radius: 15px; padding: 10px; box-sizing: border-box;
        }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); /* 7 columns for more matching room */
            gap: 4px; 
        }
        .gem { 
            aspect-ratio: 1; 
            border-radius: 20%; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
        }
        .selected { border: 3px solid white; transform: scale(1.1); z-index: 10; }
        .match-pop { transform: scale(0); opacity: 0; }

        /* Colors */
        .color-0 { background: radial-gradient(circle at 30% 30%, #ff6b6b, #c92a2a); }
        .color-1 { background: radial-gradient(circle at 30% 30%, #4dabf7, #1864ab); }
        .color-2 { background: radial-gradient(circle at 30% 30%, #69db7c, #2b8a3e); }
        .color-3 { background: radial-gradient(circle at 30% 30%, #ffd43b, #f08c00); }

        .back-btn { position: absolute; top: 20px; left: 20px; background: #d4a373; color: #4e2e1a; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 200;}
        #score-panel { font-size: 1.4rem; margin-bottom: 10px; color: #fff; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="story-view" class="screen active">
            <img id="story-img" src="assets/backgrounds/ui_landing_page_start.png">
            <div class="hitbox" style="bottom:2%; left:10%; width:80%; height:18%;" onclick="advanceStory()"></div>
        </div>

        <div id="map-view" class="screen">
            <img src="assets/map/map_saga_background.png">
            <div class="hitbox" style="bottom: 8%; left: 42%; width: 18%; height: 10%;" onclick="startLevel(1)"></div>
        </div>

        <div id="puzzle-view" class="screen">
            <img src="assets/backgrounds/bg_mystical_gates.png" style="filter: brightness(0.5) blur(3px);">
            <div class="back-btn" onclick="exitLevel()">MAP</div>
            <div id="game-ui">
                <div id="score-panel">Score: <span id="score">0</span> / 100</div>
                <div id="grid"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
