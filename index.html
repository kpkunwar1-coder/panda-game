<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pandu's Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="screen-landing" class="screen active">
        <div id="start-hotspot" onclick="startStory()"></div>
    </div>

    <div id="screen-story" class="screen" onclick="nextStorySlide()"></div>

    <div id="screen-map" class="screen">
        <div class="map-header">
            <div class="map-stat">❤️ 5</div>
            <div class="map-stat">🪙 100</div>
        </div>
        <div class="map-scroll-area">
            <div class="level-node" id="node-1" onclick="launchLevel(1)">1</div>
        </div>
        <div id="pre-level-modal" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <div class="modal-header-cloud">Level 1</div>
                <p>Objective: Match Crystals!</p>
                <button class="btn-play" onclick="confirmStartLevel()">Play!</button>
                <button class="close-btn" onclick="closePreLevel()">✕</button>
            </div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="game-header">
            <div class="moves-container">Moves: <span id="moves-count">20</span></div>
            <div class="score-bar"><div id="progress-fill"></div></div>
        </div>
        <div id="grid-container"><div id="grid"></div></div>
        
        <div id="win-popup" class="overlay" style="display:none;">
            <div class="popup-content">
                <h2>Level Complete!</h2>
                <button class="btn-play" onclick="returnToMap()">Next</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
