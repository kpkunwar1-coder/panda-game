<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --accent: #00f2ea; --secondary: #ff00ff; --bg: #0b0e14; 
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Inter', sans-serif; text-align: center; 
            background: radial-gradient(circle at top, #1e293b 0%, #0b0e14 100%);
            color: white; margin: 0; padding: 15px; min-height: 100vh; overflow-x: hidden;
        }

        h1 { 
            font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(to right, var(--accent), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 10px 0; filter: drop-shadow(0 0 8px rgba(0, 242, 234, 0.3));
        }

        #status-msg { font-weight: 600; color: var(--accent); margin-bottom: 15px; height: 20px; text-transform: uppercase; font-size: 0.8rem; }

        .stats {
            display: flex; justify-content: space-around; background: var(--card-bg);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 15px; margin: 0 auto 15px auto; width: 90%; max-width: 400px;
        }
        .stats div { font-size: 0.7rem; color: #94a3b8; }
        .stats b { display: block; font-size: 1.1rem; color: white; margin-top: 4px; }

        .game-controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .control-btn { 
            background: var(--card-bg); border: 1px solid var(--accent); color: white;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s;
        }
        .control-btn:active { transform: scale(0.9); background: var(--accent); color: var(--bg); }

        #puzzle-board { 
            display: grid; gap: 5px; width: 90vw; max-width: 400px; margin: 0 auto;
            background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tile { 
            aspect-ratio: 1 / 1; background-size: 90vw 90vw; border-radius: 6px; 
            cursor: pointer; position: relative; border: 1px solid rgba(255, 255, 255, 0.05);
        }
        @media (min-width: 400px) { .tile { background-size: 400px 400px; } }

        .selected { outline: 3px solid var(--accent); box-shadow: 0 0 15px var(--accent); z-index: 5; transform: scale(1.02); }

        .hint-num { 
            position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,0.7); 
            font-size: 10px; padding: 2px 4px; border-radius: 3px; pointer-events: none;
        }

        #preview-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 85vw; max-width: 380px; max-height: 380px;
            background-size: cover; border: 4px solid var(--accent); border-radius: 15px; z-index: 1000;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        .next-btn { 
            margin-top: 20px; padding: 15px 35px; background: linear-gradient(45deg, var(--accent), var(--secondary));
            color: white; border: none; border-radius: 50px; font-weight: bold; display: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🐼 Panda Quest</h1>
    <div id="status-msg">Loading...</div>

    <div class="stats">
        <div>Moves<b id="moves">0</b></div>
        <div>Level<b id="level-display">1/12</b></div>
        <div>Hints<b id="hint-count">3</b></div>
    </div>

    <div class="game-controls">
        <button class="control-btn" onmousedown="togglePreview(true)" onmouseup="togglePreview(false)" ontouchstart="togglePreview(true)" ontouchend="togglePreview(false)">👁️ VIEW</button>
        <button class="control-btn" onclick="useHint()">💡 HINT</button>
    </div>
    
    <div id="puzzle-board"></div>
    <div id="preview-overlay"></div>
    <button id="nextLevelBtn" class="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>

    <script>
        let moves = 0, selectedTileIndex = null, pieces = [], isShuffling = false, gridSize = 3;
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let hintsLeft = parseInt(localStorage.getItem('pandaHints')) || 3;

        const levels = [
            'image.png', 'image2.png', 'image3.png', 'image4.png',
            'image5.png', 'image6.png', 'image7.png', 'image8.png',
            'image9.png', 'image10.png', 'image11.png', 'image12.png'
        ];

        function initLevel() {
            if (currentLevel < 4) gridSize = 3;
            else if (currentLevel < 8) gridSize = 4;
            else gridSize = 5;

            document.getElementById('level-display').innerText = `${currentLevel + 1}/12`;
            document.getElementById('hint-count').innerText = hintsLeft;
            pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            
            const board = document.getElementById('puzzle-board');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            autoStart();
        }

        function drawBoard(showNumbers = false) {
            const board = document.getElementById('puzzle-board');
            board.innerHTML = '';
            pieces.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'tile';
                div.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                
                let row = Math.floor(p / gridSize), col = p % gridSize;
                let percent = 100 / (gridSize - 1);
                div.style.backgroundPosition = `${col * percent}% ${row * percent}%`;
                
                if (showNumbers) {
                    const span = document.createElement('span');
                    span.className = 'hint-num';
                    span.innerText = p + 1;
                    div.appendChild(span);
                }

                if (selectedTileIndex === i) div.classList.add('selected');
                div.onclick = () => handleTileClick(i);
                board.appendChild(div);
            });
        }

        function handleTileClick(index) {
            if (isShuffling) return;
            if (selectedTileIndex === null) {
                selectedTileIndex = index;
            } else {
                [pieces[selectedTileIndex], pieces[index]] = [pieces[index], pieces[selectedTileIndex]];
                moves++;
                document.getElementById('moves').innerText = moves;
                selectedTileIndex = null;
                checkWin();
            }
            drawBoard();
        }

        function autoStart() {
            isShuffling = true;
            moves = 0;
            document.getElementById('moves').innerText = moves;
            document.getElementById('status-msg').innerText = "Memorize the Panda...";
            document.getElementById('nextLevelBtn').style.display = 'none';
            drawBoard();

            setTimeout(() => {
                pieces.sort(() => Math.random() - 0.5);
                isShuffling = false;
                document.getElementById('status-msg').innerText = "Solve the Puzzle!";
                drawBoard();
            }, 4000);
        }

        function togglePreview(show) {
            const overlay = document.getElementById('preview-overlay');
            overlay.style.backgroundImage = `url('./${levels[currentLevel]}')`;
            overlay.style.display = show ? 'block' : 'none';
        }

        function useHint() {
            if (hintsLeft > 0 && !isShuffling) {
                hintsLeft--;
                localStorage.setItem('pandaHints', hintsLeft);
                document.getElementById('hint-count').innerText = hintsLeft;
                drawBoard(true);
                setTimeout(() => drawBoard(false), 2500);
            }
        }

        function checkWin() {
            if (pieces.every((val, index) => val === index) && moves > 0) {
                document.getElementById('status-msg').innerText = "LEVEL COMPLETE! 🏆";
                document.getElementById('nextLevelBtn').style.display = 'inline-block';
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#00f2ea', '#ff00ff'] });
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= levels.length) {
                alert("CONGRATULATIONS! You are a Panda Master!");
                currentLevel = 0;
                hintsLeft = 3;
            }
            localStorage.setItem('pandaLevel', currentLevel);
            initLevel();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
