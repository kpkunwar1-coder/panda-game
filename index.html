<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Pro Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --secondary: #ff00ff; --bg: #0b0e14; }
        body { 
            font-family: 'Inter', sans-serif; text-align: center; 
            background: radial-gradient(circle at top, #1e293b 0%, #0b0e14 100%);
            color: white; margin: 0; padding: 10px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            touch-action: none; overflow: hidden;
        }

        /* Level Selector Slider */
        .level-slider {
            display: flex; gap: 8px; overflow-x: auto; width: 95vw; 
            padding: 10px 0; margin-bottom: 10px; scrollbar-width: none;
        }
        .level-slider::-webkit-scrollbar { display: none; }
        .level-dot {
            min-width: 35px; height: 35px; background: rgba(255,255,255,0.05);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1); font-size: 0.7rem; color: #64748b;
        }
        .level-dot.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,242,234,0.3); }

        h1 { font-size: 1.2rem; letter-spacing: 2px; margin: 5px 0; text-transform: uppercase; }

        /* Controls */
        .controls { display: flex; gap: 10px; margin: 10px 0; }
        .btn-tool { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: bold;
        }
        .btn-reset { border-color: #f87171; color: #f87171; }

        /* The Board */
        #puzzle-board { 
            display: grid; gap: 2px; width: 90vw; max-width: 340px; 
            background: rgba(0,0,0,0.5); padding: 5px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;
        }
        .slot { 
            aspect-ratio: 1/1; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05);
            background-repeat: no-repeat; overflow: hidden;
        }

        /* The Horizontal Piece Slider */
        .tray-container {
            width: 100vw; background: rgba(0,0,0,0.6); 
            padding: 20px 0; position: fixed; bottom: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        #piece-tray { 
            display: flex; gap: 15px; overflow-x: scroll; 
            padding: 0 25px; width: auto; scrollbar-width: none;
        }
        #piece-tray::-webkit-scrollbar { display: none; }

        .tile { 
            flex: 0 0 auto; aspect-ratio: 1/1; border-radius: 6px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-repeat: no-repeat; border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.1s;
        }

        #preview-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw; max-width: 320px; border: 2px solid var(--accent);
            border-radius: 10px; z-index: 2000; background-size: cover; box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        .next-btn { 
            position: fixed; top: 45%; padding: 15px 40px; 
            background: var(--accent); color: var(--bg); 
            border: none; border-radius: 50px; font-weight: 800; 
            display: none; z-index: 3000; box-shadow: 0 0 30px var(--accent);
        }
    </style>
</head>
<body>

    <div class="level-slider" id="levelSlider"></div>
    <h1>PANDA QUEST</h1>
    
    <div class="controls">
        <button class="btn-tool" onmousedown="showFull(true)" onmouseup="showFull(false)" ontouchstart="showFull(true)" ontouchend="showFull(false)">👁️ PREVIEW</button>
        <button class="btn-tool btn-reset" onclick="initLevel()">🔄 RESET</button>
        <button class="btn-tool" onclick="useHint()">💡 HINT</button>
    </div>

    <div id="puzzle-board"></div>

    <div class="tray-container">
        <div id="piece-tray"></div>
    </div>

    <div id="preview-overlay"></div>
    <button id="nextLevelBtn" class="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>

    <script>
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let gridSize = 3;
        const levels = Array.from({length: 12}, (_, i) => i === 0 ? 'image.png' : `image${i + 1}.png`);

        function initLevel() {
            // Level Slider Update
            const slider = document.getElementById('levelSlider');
            slider.innerHTML = '';
            levels.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `level-dot ${i === currentLevel ? 'active' : ''}`;
                dot.innerText = i + 1;
                slider.appendChild(dot);
            });

            gridSize = currentLevel < 4 ? 3 : (currentLevel < 8 ? 4 : 5);
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('piece-tray');
            
            const boardWidth = Math.min(window.innerWidth * 0.9, 340);
            const tileSize = boardWidth / gridSize;
            
            board.style.width = boardWidth + 'px';
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = ''; tray.innerHTML = '';
            document.getElementById('nextLevelBtn').style.display = 'none';

            // Create Slots with Ghost Background
            for(let i=0; i < gridSize * gridSize; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                
                // Ghost Image Logic
                slot.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                slot.style.backgroundSize = `${boardWidth}px ${boardWidth}px`;
                let sRow = Math.floor(i / gridSize), sCol = i % gridSize;
                slot.style.backgroundPosition = `-${sCol * tileSize}px -${sRow * tileSize}px`;
                slot.style.opacity = "0.1"; // Faint guide
                
                board.appendChild(slot);
            }

            // Create Shuffled Pieces
            let pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.correctIndex = p;
                
                // Sizing tiles for the tray
                const trayTileSize = Math.floor(boardWidth / 4); 
                tile.style.width = trayTileSize + 'px';
                tile.style.height = trayTileSize + 'px';
                
                tile.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                tile.style.backgroundSize = `${boardWidth}px ${boardWidth}px`;
                
                // Perfect Pixel Cutting
                let row = Math.floor(p / gridSize);
                let col = p % gridSize;
                tile.style.backgroundPosition = `-${col * tileSize}px -${row * tileSize}px`;

                tile.addEventListener('touchstart', touchStart, {passive: false});
                tile.addEventListener('touchmove', touchMove, {passive: false});
                tile.addEventListener('touchend', touchEnd);
                tray.appendChild(tile);
            });
        }

        // --- Drag & Drop Logic ---
        let activeTile = null;
        let isDragging = false;

        function touchStart(e) { activeTile = e.target; isDragging = false; }

        function touchMove(e) {
            if (!activeTile) return;
            isDragging = true;
            let touch = e.touches[0];
            activeTile.style.position = 'fixed';
            activeTile.style.width = (340 / gridSize) + 'px'; // Scale to board size while dragging
            activeTile.style.left = (touch.clientX - activeTile.offsetWidth/2) + 'px';
            activeTile.style.top = (touch.clientY - activeTile.offsetHeight/2) + 'px';
            activeTile.style.zIndex = "5000";
        }

        function touchEnd(e) {
            if (!activeTile) return;
            if (!isDragging) { activeTile = null; return; }

            let touch = e.changedTouches[0];
            activeTile.style.display = 'none';
            let target = document.elementFromPoint(touch.clientX, touch.clientY);
            activeTile.style.display = 'block';

            let slot = target ? target.closest('.slot') : null;

            if (slot && slot.children.length === 0) {
                activeTile.style.position = 'static';
                activeTile.style.width = '100%';
                activeTile.style.height = '100%';
                slot.appendChild(activeTile);
                slot.style.opacity = "1"; // Reveal full color
                if(window.navigator.vibrate) window.navigator.vibrate(20);
                checkWin();
            } else {
                activeTile.style.position = 'static';
                activeTile.style.width = Math.floor(340 / 4) + 'px';
                activeTile.style.height = Math.floor(340 / 4) + 'px';
                document.getElementById('piece-tray').appendChild(activeTile);
            }
            activeTile = null;
        }

        function checkWin() {
            const slots = document.querySelectorAll('.slot');
            let correct = 0, filled = 0;
            slots.forEach((s, i) => {
                if(s.children.length > 0) {
                    filled++;
                    if(parseInt(s.firstChild.dataset.correctIndex) === i) correct++;
                }
            });
            if(filled === gridSize * gridSize && correct === filled) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('nextLevelBtn').style.display = 'block';
            }
        }

        function showFull(show) {
            const over = document.getElementById('preview-overlay');
            over.style.backgroundImage = `url('./${levels[currentLevel]}')`;
            over.style.display = show ? 'block' : 'none';
        }

        function useHint() {
            const trayPieces = document.querySelectorAll('#piece-tray .tile');
            if (trayPieces.length === 0) return;
            const piece = trayPieces[0];
            const targetSlot = document.querySelector(`.slot[data-index="${piece.dataset.correctIndex}"]`);
            targetSlot.style.boxShadow = "inset 0 0 20px var(--accent)";
            setTimeout(() => targetSlot.style.boxShadow = "none", 1500);
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= levels.length) currentLevel = 0;
            localStorage.setItem('pandaLevel', currentLevel);
            initLevel();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
