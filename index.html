<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pandu's Adventure</title>
    <style>
        body { background: #000; color: white; text-align: center; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }
        .game-container { max-width: 500px; margin: auto; position: relative; height: 100vh; background: #1a1a1a; }
        .screen { display: none; width: 100%; height: 100%; position: relative; }
        .active { display: block; }
        img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Game UI */
        #game-ui {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            width: 95%; background: rgba(0,0,0,0.85); border: 4px solid #7ca852;
            border-radius: 15px; padding: 10px; box-sizing: border-box;
        }
        #grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 4px; 
            touch-action: none; /* Prevents screen scrolling while swiping */
        }
        .gem { 
            aspect-ratio: 1; 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            user-select: none;
            background: rgba(255,255,255,0.1);
            transition: transform 0.2s;
        }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #d4a373; color: #4e2e1a; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 200;}
        #score-panel { font-size: 1.4rem; margin-bottom: 10px; color: gold; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-container">
        <div id="story-view" class="screen active"><img id="story-img" src="assets/backgrounds/ui_landing_page_start.png" onclick="advanceStory()"></div>
        <div id="map-view" class="screen"><img src="assets/map/map_saga_background.png"><div style="position:absolute; bottom:8%; left:42%; width:18%; height:10%;" onclick="startLevel(1)"></div></div>

        <div id="puzzle-view" class="screen">
            <img src="assets/backgrounds/bg_mystical_gates.png" style="filter: brightness(0.4) blur(4px);">
            <div class="back-btn" onclick="exitLevel()">MAP</div>
            <div id="game-ui">
                <div id="score-panel">💎 GEMS: <span id="score">0</span> / 100</div>
                <div id="grid"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
