<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Final Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --bg: #0b0e14; }
        body { 
            font-family: sans-serif; background: var(--bg); color: white; 
            margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center;
        }
        /* Top Stats */
        .header { width: 100%; background: #000; padding: 10px 0; text-align: center; border-bottom: 1px solid #333; }
        #heart-display { font-size: 1.5rem; letter-spacing: 5px; }

        /* The Board */
        #puzzle-board { 
            display: grid; gap: 2px; width: 90vw; max-width: 350px; 
            background: #1e293b; padding: 6px; border-radius: 10px; margin-top: 20px;
        }
        .slot { aspect-ratio: 1/1; background: #0f172a; border-radius: 4px; }

        /* Sliding Tray */
        .tray-container { width: 100vw; background: #161b22; position: fixed; bottom: 0; padding: 20px 0; border-top: 1px solid #333; }
        #piece-tray { display: flex; gap: 15px; overflow-x: auto; padding: 0 30px; min-height: 80px; align-items: center; }
        
        .tile { flex: 0 0 auto; background-repeat: no-repeat; border: 1px solid #444; border-radius: 4px; }
        .tile.dragging { position: fixed !important; z-index: 99999; pointer-events: none; transform: scale(1.1); border: 2px solid var(--accent); }
        .tile.fixed { pointer-events: none; border: none; }

        /* THE MODAL - High Z-Index to ensure it's on top */
        #start-modal { 
            position: fixed; inset: 0; background: #0b0e14; z-index: 100000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        #preview-img { 
            width: 250px; height: 250px; border: 3px solid var(--accent); 
            background-color: #1e293b; background-size: cover; margin-bottom: 20px; 
        }
        .btn-play { 
            padding: 20px 60px; background: var(--accent); color: #000; 
            border: none; border-radius: 50px; font-weight: bold; font-size: 1.2rem; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-modal">
        <h1>PANDA QUEST</h1>
        <div id="preview-img"></div>
        <button class="btn-play" id="startBtn" onclick="closeModal()">START GAME</button>
        <p id="debug-text" style="font-size: 10px; color: gray; margin-top: 10px;"></p>
    </div>

    <div class="header">
        <div id="heart-display">❤️❤️❤️❤️❤️</div>
    </div>

    <div id="puzzle-board"></div>

    <div class="tray-container">
        <div id="piece-tray"></div>
    </div>

    <script>
        // CONFIG
        let level = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let lives = parseInt(localStorage.getItem('pandaLives')) || 5;
        // Check image names! Ensure image.png, image1.png etc exist in the folder.
        const images = ['image.png', 'image1.png', 'image2.png', 'image3.png', 'image4.png', 'image5.png'];
        const currentImg = `./${images[level % images.length]}`;
        const grid = level < 3 ? 3 : 4;
        const boardSize = 350;

        // DEBUG HELPER
        function log(msg) { document.getElementById('debug-text').innerText = msg; }

        function init() {
            log("Loading Level: " + (level + 1));
            
            // Set Preview Image
            const prev = document.getElementById('preview-img');
            prev.style.backgroundImage = `url('${currentImg}')`;

            // Build Board
            const board = document.getElementById('puzzle-board');
            board.style.gridTemplateColumns = `repeat(${grid}, 1fr)`;
            board.innerHTML = '';
            for(let i=0; i < grid*grid; i++) {
                let s = document.createElement('div');
                s.className = 'slot';
                s.dataset.idx = i;
                board.appendChild(s);
            }

            // Build Pieces
            const tray = document.getElementById('piece-tray');
            tray.innerHTML = '';
            let pieces = Array.from({length: grid*grid}, (_, i) => i).sort(() => Math.random() - 0.5);
            
            pieces.forEach(p => {
                let t = document.createElement('div');
                t.className = 'tile';
                t.dataset.correct = p;
                t.style.width = '70px'; t.style.height = '70px';
                t.style.backgroundImage = `url('${currentImg}')`;
                t.style.backgroundSize = `${boardSize}px ${boardSize}px`;
                let r = Math.floor(p/grid), c = p%grid;
                t.style.backgroundPosition = `-${c * (boardSize/grid)}px -${r * (boardSize/grid)}px`;
                
                t.addEventListener('touchstart', (e) => { active = e.target; });
                t.addEventListener('touchmove', handleMove);
                t.addEventListener('touchend', handleEnd);
                tray.appendChild(t);
            });
        }

        function closeModal() {
            log("Button clicked!");
            document.getElementById('start-modal').style.display = 'none';
        }

        let active = null;
        function handleMove(e) {
            if(!active) return;
            e.preventDefault();
            let touch = e.touches[0];
            active.classList.add('dragging');
            active.style.width = (boardSize/grid) + 'px';
            active.style.height = (boardSize/grid) + 'px';
            active.style.left = touch.clientX + 'px';
            active.style.top = (touch.clientY - 70) + 'px';
            active.style.marginLeft = `-${(boardSize/grid)/2}px`;
        }

        function handleEnd(e) {
            if(!active) return;
            active.classList.remove('dragging');
            let t = e.changedTouches[0];
            active.style.display = 'none';
            let el = document.elementFromPoint(t.clientX, t.clientY - 70);
            active.style.display = 'block';

            let slot = el ? el.closest('.slot') : null;
            if(slot && slot.dataset.idx == active.dataset.correct) {
                active.style.position = 'static';
                active.style.width = '100%'; active.style.height = '100%'; active.style.margin = '0';
                active.classList.add('fixed');
                slot.appendChild(active);
                if(document.querySelectorAll('.fixed').length == grid*grid) {
                    confetti();
                    setTimeout(() => { level++; localStorage.setItem('pandaLevel', level); location.reload(); }, 2000);
                }
            } else {
                active.style.position = 'static'; active.style.width = '70px'; active.style.height = '70px'; active.style.margin = '0';
                document.getElementById('piece-tray').appendChild(active);
            }
            active = null;
        }

        window.onload = init;
    </script>
</body>
</html>
