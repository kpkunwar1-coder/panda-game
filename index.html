<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Move Saga</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --bg: #0b0e14; --panel: #161b22; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }

        /* Top Bar */
        .header { width: 100%; background: #000; padding: 15px 0; border-bottom: 1px solid #333; text-align: center; z-index: 100; }
        #heart-display { font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 5px; }
        #heart-timer { font-size: 0.7rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; }

        /* Stats Row */
        .stats-bar { display: flex; justify-content: space-around; width: 100%; max-width: 400px; margin: 20px 0; }
        .stat-box { text-align: center; background: var(--panel); padding: 10px 20px; border-radius: 10px; border: 1px solid #333; }
        .stat-label { font-size: 0.6rem; color: #94a3b8; display: block; margin-bottom: 2px; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--accent); }

        /* Puzzle Board */
        #puzzle-board { 
            display: grid; gap: 4px; width: 90vw; max-width: 360px; 
            background: #1e293b; padding: 8px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .tile { 
            aspect-ratio: 1/1; background-repeat: no-repeat; border-radius: 4px;
            transition: transform 0.1s ease-out; cursor: pointer;
        }
        .tile.empty { background: #0f172a !important; cursor: default; border: 1px dashed #334155; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Modal & UI */
        #start-modal { position: fixed; inset: 0; background: #0b0e14; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #preview-img { width: 200px; height: 200px; border: 3px solid var(--accent); border-radius: 12px; margin: 20px 0; background-size: cover; }
        .btn-play { padding: 18px 60px; background: var(--accent); color: #000; border-radius: 50px; border: none; font-weight: 800; font-size: 1.1rem; min-width: 200px; cursor: pointer; }
        .btn-disabled { background: #334155 !important; color: #94a3b8 !important; }

        .hint-text { font-size: 0.85rem; color: #94a3b8; margin: 0 40px 20px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="start-modal">
        <h2 id="level-title">WORLD 1</h2>
        <div id="preview-img"></div>
        <p class="hint-text">Slide tiles to complete the image before you run out of moves!</p>
        <button class="btn-play" id="main-btn" onclick="closeModal()">START</button>
    </div>

    <div class="header">
        <div id="heart-display">❤️❤️❤️❤️❤️</div>
        <div id="heart-timer">Full Energy</div>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-label">MOVES</span>
            <span id="moves-left" class="stat-value">--</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">TARGET</span>
            <span id="target-moves" class="stat-value">--</span>
        </div>
    </div>

    <div id="puzzle-board"></div>

    <script>
        // --- GAME STATE ---
        let level = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let lives = localStorage.getItem('pandaLives');
        
        // Fix for first-time players
        if (lives === null || isNaN(parseInt(lives))) {
            lives = 5;
            localStorage.setItem('pandaLives', 5);
        } else {
            lives = parseInt(lives);
        }

        let lastLoss = parseInt(localStorage.getItem('pandaLastLoss')) || Date.now();
        const REFILL_MS = 30 * 60000; // 30 mins

        // Level Balancing
        const grid = level < 3 ? 3 : 4; 
        const moveLimit = level < 3 ? 40 : 80;
        let currentMoves = moveLimit;

        const images = ['image.png', 'image1.png', 'image2.png', 'image3.png', 'image4.png', 'image5.png'];
        const currentImg = `./${images[level % images.length]}`;
        let tiles = [];

        function init() {
            updateUI();
            
            // Setup Board
            tiles = Array.from({length: grid * grid}, (_, i) => i);
            shuffleBoard();
            renderBoard();
        }

        function shuffleBoard() {
            // Simulate random valid moves so the puzzle is 100% solvable
            for (let i = 0; i < 200; i++) {
                let emptyIdx = tiles.indexOf(grid * grid - 1);
                let neighbors = getNeighbors(emptyIdx);
                let rand = neighbors[Math.floor(Math.random() * neighbors.length)];
                [tiles[emptyIdx], tiles[rand]] = [tiles[rand], tiles[emptyIdx]];
            }
        }

        function getNeighbors(idx) {
            let res = [];
            let r = Math.floor(idx / grid), c = idx % grid;
            if (r > 0) res.push(idx - grid);
            if (r < grid - 1) res.push(idx + grid);
            if (c > 0) res.push(idx - 1);
            if (c < grid - 1) res.push(idx + 1);
            return res;
        }

        function renderBoard() {
            const board = document.getElementById('puzzle-board');
            board.style.gridTemplateColumns = `repeat(${grid}, 1fr)`;
            board.innerHTML = '';
            const boardPx = 360;

            tiles.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'tile' + (val === grid * grid - 1 ? ' empty' : '');
                
                if (val !== grid * grid - 1) {
                    div.style.backgroundImage = `url('${currentImg}')`;
                    div.style.backgroundSize = `${boardPx}px ${boardPx}px`;
                    let r = Math.floor(val / grid), c = val % grid;
                    div.style.backgroundPosition = `-${c * (boardPx/grid)}px -${r * (boardPx/grid)}px`;
                }

                div.onclick = () => handleMove(i);
                board.appendChild(div);
            });
        }

        function handleMove(idx) {
            if (currentMoves <= 0 || lives <= 0) return;

            let emptyIdx = tiles.indexOf(grid * grid - 1);
            let neighbors = getNeighbors(emptyIdx);

            if (neighbors.includes(idx)) {
                [tiles[emptyIdx], tiles[idx]] = [tiles[idx], tiles[emptyIdx]];
                currentMoves--;
                document.getElementById('moves-left').innerText = currentMoves;
                if(window.navigator.vibrate) window.navigator.vibrate(15);
                renderBoard();
                checkGameState();
            }
        }

        function checkGameState() {
            if (tiles.every((v, i) => v === i)) {
                confetti();
                setTimeout(() => {
                    level++;
                    localStorage.setItem('pandaLevel', level);
                    location.reload();
                }, 2000);
            } else if (currentMoves <= 0) {
                // FAIL STATE
                lives--;
                lastLoss = Date.now();
                localStorage.setItem('pandaLives', lives);
                localStorage.setItem('pandaLastLoss', lastLoss);
                
                document.getElementById('puzzle-board').style.animation = "shake 0.5s";
                setTimeout(() => {
                    alert("Out of moves! Heart lost.");
                    location.reload();
                }, 500);
            }
        }

        function updateUI() {
            // Heart Regeneration
            const now = Date.now();
            if (lives < 5) {
                let regen = Math.floor((now - lastLoss) / REFILL_MS);
                if (regen > 0) {
                    lives = Math.min(5, lives + regen);
                    lastLoss = now;
                    localStorage.setItem('pandaLives', lives);
                }
            }

            // Top Header
            document.getElementById('heart-display').innerText = '❤️'.repeat(lives) + '🖤'.repeat(5 - lives);
            
            // Move Stats
            document.getElementById('moves-left').innerText = currentMoves;
            document.getElementById('target-moves').innerText = moveLimit;

            // Modal
            document.getElementById('level-title').innerText = `WORLD ${level + 1}`;
            document.getElementById('preview-img').style.backgroundImage = `url('${currentImg}')`;

            const startBtn = document.getElementById('main-btn');
            const timerLabel = document.getElementById('heart-timer');

            if (lives <= 0) {
                const remaining = REFILL_MS - (now - lastLoss);
                const m = Math.floor(remaining / 60000);
                const s = Math.floor((remaining % 60000) / 1000);
                const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;
                
                startBtn.innerText = `WAIT ${timeStr}`;
                startBtn.classList.add('btn-disabled');
                timerLabel.innerText = `REGENERATING: ${timeStr}`;
            } else {
                startBtn.innerText = "START LEVEL";
                startBtn.classList.remove('btn-disabled');
                timerLabel.innerText = lives < 5 ? "Regenerating..." : "Full Energy";
            }
        }

        function closeModal() {
            if (lives > 0) document.getElementById('start-modal').style.display = 'none';
        }

        window.onload = init;
        setInterval(updateUI, 1000);
    </script>
</body>
</html>
