<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Saga Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --bg: #0b0e14; --panel: #161b22; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; 
            margin: 0; padding: 0; min-height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; touch-action: none;
        }

        /* Stats & Level Header */
        .header { width: 100%; padding: 10px 0; background: #000; border-bottom: 1px solid #30363d; z-index: 100; text-align: center; }
        #heart-display { font-size: 1.4rem; letter-spacing: 4px; margin-bottom: 4px; }
        #heart-timer { font-size: 0.7rem; color: #94a3b8; margin-bottom: 8px; }
        
        .level-slider { display: flex; gap: 10px; overflow-x: auto; padding: 5px 15px; scrollbar-width: none; }
        .level-dot { min-width: 28px; height: 28px; border-radius: 50%; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border: 1px solid #334155; flex-shrink: 0; }
        .level-dot.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,242,234,0.3); }

        /* Icon Controls */
        .controls { display: flex; gap: 30px; margin: 15px 0; }
        .icon-btn { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; gap: 5px; cursor: pointer; }
        .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* Puzzle Board */
        #puzzle-board { 
            display: grid; gap: 2px; width: 90vw; max-width: 350px; 
            background: #1e293b; padding: 6px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); position: relative;
        }
        .slot { aspect-ratio: 1/1; background: #0f172a; border-radius: 4px; }

        /* Tile Styling & Dragging */
        .tile { flex: 0 0 auto; background-repeat: no-repeat; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; touch-action: none; }
        .tile.dragging {
            position: fixed !important; z-index: 10000; pointer-events: none;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
            transform: scale(1.05); border: 2px solid var(--accent) !important;
        }
        .tile.fixed { pointer-events: none; border: none; z-index: 1; }

        /* Sliding Tray */
        .tray-container { width: 100vw; background: var(--panel); position: fixed; bottom: 0; padding: 20px 0; border-top: 1px solid #30363d; }
        #piece-tray { display: flex; gap: 15px; overflow-x: auto; padding: 0 30px; scrollbar-width: none; min-height: 85px; align-items: center; }

        /* Intro Modal */
        #start-modal { position: fixed; inset: 0; background: rgba(11, 14, 20, 0.98); z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #preview-img { width: 260px; height: 260px; border: 4px solid var(--accent); border-radius: 15px; margin: 25px 0; background-size: cover; box-shadow: 0 0 25px rgba(0,242,234,0.2); }
        .btn-play { padding: 18px 60px; background: var(--accent); color: black; border-radius: 50px; border: none; font-weight: 800; font-size: 1.2rem; cursor: pointer; }
        
        /* Preview Overlay (Eye Icon) */
        #eye-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; height: 340px; border: 3px solid var(--accent); border-radius: 10px; z-index: 5000; background-size: cover; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <div id="heart-display">❤️❤️❤️❤️❤️</div>
        <div id="heart-timer">FULL STAMINA</div>
        <div class="level-slider" id="level-slider"></div>
    </div>

    <div class="controls">
        <button class="icon-btn" ontouchstart="toggleEye(true)" ontouchend="toggleEye(false)" onmousedown="toggleEye(true)" onmouseup="toggleEye(false)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            PREVIEW
        </button>
        <button class="icon-btn" onclick="location.reload()">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            RESET
        </button>
    </div>

    <div id="puzzle-board"></div>

    <div class="tray-container">
        <div id="piece-tray"></div>
    </div>

    <div id="start-modal">
        <h2 style="letter-spacing: 2px;">READY TO SOLVE?</h2>
        <div id="preview-img"></div>
        <button class="btn-play" onclick="closeModal()" ontouchend="closeModal()">START</button>
    </div>

    <div id="eye-overlay"></div>

        let lives = parseInt(localStorage.getItem('pandaLives'));
        if (isNaN(lives)) lives = 5; // Safety reset
        let lastLoss = parseInt(localStorage.getItem('pandaLastLoss')) || Date.now();

        function refreshStamina() {
            if (lives < 5) {
                let passed = Date.now() - lastLoss;
                let regen = Math.floor(passed / (30 * 60000));
                if (regen > 0) {
                    lives = Math.min(5, lives + regen);
                    lastLoss = Date.now();
                }
            }
            document.getElementById('heart-display').innerText = '❤️'.repeat(lives) + '🖤'.repeat(5 - lives);
            localStorage.setItem('pandaLives', lives);
            localStorage.setItem('pandaLastLoss', lastLoss);
        }

        let boardPx = 350;
