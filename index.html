<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Jigsaw Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --accent: #00f2ea; --secondary: #ff00ff; --bg: #0b0e14; 
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Inter', sans-serif; text-align: center; 
            background: radial-gradient(circle at top, #1e293b 0%, #0b0e14 100%);
            color: white; margin: 0; padding: 10px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .progress-container { width: 90%; max-width: 400px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(to right, var(--accent), var(--secondary)); transition: 0.5s; }

        h1 { font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; margin: 5px 0; background: linear-gradient(to right, var(--accent), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .stats { display: flex; justify-content: space-around; background: var(--card-bg); width: 90%; max-width: 400px; padding: 10px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .stats div { font-size: 0.7rem; color: #94a3b8; }
        .stats b { display: block; font-size: 1rem; color: white; }

        /* The Sleek Empty Board */
        #puzzle-board { 
            display: grid; gap: 2px; width: 92vw; max-width: 380px; 
            background: rgba(0,0,0,0.3); padding: 4px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;
        }

        .slot { aspect-ratio: 1/1; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.1); border-radius: 4px; position: relative; }

        /* The Piece Tray */
        #piece-tray { 
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; 
            width: 92vw; max-width: 400px; padding: 15px; 
            background: rgba(255,255,255,0.05); border-radius: 15px; min-height: 80px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tile { 
            aspect-ratio: 1/1; border-radius: 4px; cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: none;
            background-repeat: no-repeat;
        }
        .tile:active { cursor: grabbing; transform: scale(1.1); z-index: 100; }
        
        /* Hint Styles */
        .hint-correct { border: 2px solid #4ade80 !important; }
        .hint-wrong { border: 2px solid #f87171 !important; }

        .next-btn { margin-top: 20px; padding: 12px 30px; background: linear-gradient(45deg, var(--accent), var(--secondary)); color: white; border: none; border-radius: 50px; font-weight: bold; display: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="progress-container"><div id="progress-fill"></div></div>
    <h1>🐼 Panda Quest</h1>
    <div id="status-msg" style="font-size: 0.8rem; color: var(--accent); margin-bottom: 10px;">Drag pieces to the board!</div>

    <div class="stats">
        <div>Level<b id="level-display">1/12</b></div>
        <div>Grid<b id="grid-display">3x3</b></div>
        <div>Hints<b id="hint-count">3</b></div>
    </div>

    <div id="puzzle-board"></div>
    <div id="piece-tray"></div>

    <button id="nextLevelBtn" class="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>

    <script>
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let hintsLeft = parseInt(localStorage.getItem('pandaHints')) || 3;
        let gridSize = 3;
        const levels = Array.from({length: 12}, (_, i) => `image${i === 0 ? '' : i + 1}.png`); // Handles image.png then image2.png...
        
        // Correcting your specific first image name
        levels[0] = 'image.png'; 

        function initLevel() {
            if (currentLevel < 4) gridSize = 3;
            else if (currentLevel < 8) gridSize = 4;
            else gridSize = 5;

            document.getElementById('level-display').innerText = `${currentLevel + 1}/12`;
            document.getElementById('grid-display').innerText = `${gridSize}x${gridSize}`;
            document.getElementById('progress-fill').style.width = `${(currentLevel / 12) * 100}%`;
            document.getElementById('nextLevelBtn').style.display = 'none';

            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('piece-tray');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = '';
            tray.innerHTML = '';

            // Create Slots
            for(let i=0; i < gridSize * gridSize; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                // Basic Drag/Drop API
                slot.addEventListener('dragover', e => e.preventDefault());
                slot.addEventListener('drop', handleDrop);
                board.appendChild(slot);
            }

            // Create Shuffled Pieces
            let pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.draggable = true;
                tile.dataset.correctIndex = p;
                
                // Size tiles based on grid
                const tileSize = Math.floor(340 / gridSize);
                tile.style.width = tileSize + 'px';
                tile.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                tile.style.backgroundSize = `${gridSize * 100}%`;
                
                let row = Math.floor(p / gridSize), col = p % gridSize;
                let percent = 100 / (gridSize - 1);
                tile.style.backgroundPosition = `${col * percent}% ${row * percent}%`;

                tile.addEventListener('dragstart', (e) => {
                    window.draggedPiece = tile;
                });

                tray.appendChild(tile);
            });
        }

        function handleDrop(e) {
            e.preventDefault();
            const slot = e.target.closest('.slot');
            if (slot && slot.children.length === 0) {
                const piece = window.draggedPiece;
                piece.style.width = "100%";
                slot.appendChild(piece);
                checkWin();
            }
        }
