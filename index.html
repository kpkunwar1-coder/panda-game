<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Saga Adventure</title>
    <style>
        /* This part makes the game look nice */
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .game-container { max-width: 500px; margin: auto; border: 4px solid #444; border-radius: 15px; overflow: hidden; background: #000; }
        img { max-width: 100%; height: auto; display: block; }
        .menu-bar { padding: 15px; background: #333; display: flex; justify-content: space-around; }
        .btn { padding: 10px 15px; background: #FFD700; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #333; }
        #puzzle-view { display: none; } /* Hidden until a level is clicked */
    </style>
</head>
<body>

    <div class="game-container">
        <div id="map-view">
            <img src="assets/map/map_saga_20_pedestals.png" alt="Saga Map">
            <div class="menu-bar">
                <button class="btn" onclick="openLevel(1)">Test Level 1</button>
                <button class="btn" onclick="openLevel(9)">Test Level 9</button>
            </div>
        </div>

        <div id="puzzle-view">
            <h2 id="level-title">Level 1</h2>
            <img id="puzzle-image" src="" alt="Level Puzzle">
            <div class="menu-bar">
                <button class="btn" onclick="goBack()">Back to Map</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
