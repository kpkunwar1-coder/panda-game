<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Jigsaw Master</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --secondary: #ff00ff; --bg: #0b0e14; }
        body { 
            font-family: 'Inter', sans-serif; text-align: center; 
            background: radial-gradient(circle at top, #1e293b 0%, #0b0e14 100%);
            color: white; margin: 0; padding: 10px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            touch-action: none; overflow: hidden;
        }

        /* 🖼️ The Level Slider */
        .level-slider {
            display: flex; gap: 10px; overflow-x: auto; width: 95vw; 
            padding: 10px; margin-bottom: 15px; scrollbar-width: none;
        }
        .level-dot {
            min-width: 40px; height: 40px; background: rgba(255,255,255,0.1);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2); font-size: 0.8rem;
        }
        .level-dot.active { background: var(--accent); color: var(--bg); font-weight: bold; }

        h1 { font-size: 1.4rem; margin: 5px 0; background: linear-gradient(to right, var(--accent), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 👁️ Game Controls */
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-tool { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--accent);
            color: white; padding: 8px 15px; border-radius: 8px; font-size: 0.9rem;
        }

        #puzzle-board { 
            display: grid; gap: 2px; width: 90vw; max-width: 350px; 
            background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px;
        }
        .slot { aspect-ratio: 1/1; background: rgba(0,0,0,0.3); border-radius: 4px; border: 1px dashed rgba(255,255,255,0.1); }
        
        /* Hint Glow */
        .slot.hint-target { box-shadow: inset 0 0 15px var(--accent); border: 1px solid var(--accent); }

        #piece-tray { 
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; 
            width: 90vw; max-width: 380px; padding: 10px; min-height: 80px;
            background: rgba(255,255,255,0.05); border-radius: 12px;
        }

        .tile { aspect-ratio: 1/1; border-radius: 4px; touch-action: none; background-repeat: no-repeat; z-index: 10; }

        /* 🖼️ Full Image Overlay */
        #preview-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw; max-width: 320px; border: 3px solid var(--accent);
            border-radius: 15px; z-index: 2000; background-size: cover;
        }

        .next-btn { margin-top: 15px; padding: 12px 30px; background: linear-gradient(45deg, var(--accent), var(--secondary)); color: white; border: none; border-radius: 50px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="level-slider" id="levelSlider"></div>

    <h1>🐼 PANDA QUEST</h1>
    
    <div class="controls">
        <button class="btn-tool" onmousedown="showFull(true)" onmouseup="showFull(false)" ontouchstart="showFull(true)" ontouchend="showFull(false)">👁️ VIEW</button>
        <button class="btn-tool" onclick="useHint()">💡 HINT</button>
    </div>

    <div id="puzzle-board"></div>
    <div id="piece-tray"></div>
    <div id="preview-overlay"></div>

    <button id="nextLevelBtn" class="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>

    <script>
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let gridSize = 3;
        const levels = Array.from({length: 12}, (_, i) => `image${i + 1}.png`);

        function buildSlider() {
            const slider = document.getElementById('levelSlider');
            slider.innerHTML = '';
            levels.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `level-dot ${i === currentLevel ? 'active' : ''}`;
                dot.innerText = i + 1;
                slider.appendChild(dot);
            });
        }

        function initLevel() {
            buildSlider();
            gridSize = currentLevel < 4 ? 3 : (currentLevel < 8 ? 4 : 5);
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('piece-tray');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = ''; tray.innerHTML = '';
            document.getElementById('nextLevelBtn').style.display = 'none';

            for(let i=0; i < gridSize * gridSize; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                board.appendChild(slot);
            }

            let pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.correctIndex = p;
                const tileSize = Math.floor(300 / gridSize);
                tile.style.width = tileSize + 'px';
                tile.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                tile.style.backgroundSize = `${gridSize * 100}%`;
                let row = Math.floor(p / gridSize), col = p % gridSize;
                let percent = 100 / (gridSize - 1);
                tile.style.backgroundPosition = `${col * percent}% ${row * percent}%`;

                tile.addEventListener('touchstart', touchStart, {passive: false});
                tile.addEventListener('touchmove', touchMove, {passive: false});
                tile.addEventListener('touchend', touchEnd);
                tray.appendChild(tile);
            });
        }

        function showFull(show) {
            const over = document.getElementById('preview-overlay');
            over.style.backgroundImage = `url('./${levels[currentLevel]}')`;
            over.style.display = show ? 'block' : 'none';
        }

        function useHint() {
            const trayPieces = document.querySelectorAll('#piece-tray .tile');
            if (trayPieces.length === 0) return;
            
            const randomPiece = trayPieces[Math.floor(Math.random() * trayPieces.length)];
            const correctIdx = randomPiece.dataset.correctIndex;
            const targetSlot = document.querySelector(`.slot[data-index="${correctIdx}"]`);

            targetSlot.classList.add('hint-target');
            randomPiece.style.boxShadow = "0 0 15px #00f2ea";
            
            setTimeout(() => {
                targetSlot.classList.remove('hint-target');
                randomPiece.style.boxShadow = "0 4px 10px rgba(0,0,0,0.5)";
            }, 2000);
        }

        // --- Drag Logic ---
        let activeTile = null;
        function touchStart(e) { activeTile = e.target; activeTile.style.zIndex = "1000"; }
        function touchMove(e) {
            if (!activeTile) return; e.preventDefault();
            let touch = e.touches[0];
            activeTile.style.position = 'fixed';
            activeTile.style.left = (touch.clientX - activeTile.offsetWidth/2) + 'px';
            activeTile.style.top = (touch.clientY - activeTile.offsetHeight/2) + 'px';
        }
        function touchEnd(e) {
            if (!activeTile) return;
            let touch = e.changedTouches[0];
            activeTile.style.display = 'none';
            let dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
            activeTile.style.display = 'block';
            let slot = dropTarget ? dropTarget.closest('.slot') : null;

            if (slot && slot.children.length === 0) {
                activeTile.style.position = 'static';
                activeTile.style.width = '100%';
                slot.appendChild(activeTile);
                checkWin();
            } else {
                activeTile.style.position = 'static';
                activeTile.style.width = Math.floor(300 / gridSize) + 'px';
                document.getElementById('piece-tray').appendChild(activeTile);
            }
            activeTile = null;
        }

        function checkWin() {
            const slots = document.querySelectorAll('.slot');
            let correct = 0, filled = 0;
            slots.forEach((s, i) => {
                if(s.children.length > 0) {
                    filled++;
                    if(parseInt(s.firstChild.dataset.correctIndex) === i) correct++;
                }
            });
            if(filled === gridSize * gridSize && correct === filled) {
                confetti(); document.getElementById('nextLevelBtn').style.display = 'block';
            }
        }

        function nextLevel() {
            currentLevel++;
            localStorage.setItem('pandaLevel', currentLevel);
            initLevel();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
