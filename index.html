<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Pro Restoration</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --bg: #0b0e14; --panel: #161b22; }
        body { 
            font-family: 'Inter', sans-serif; background: var(--bg); color: white; 
            margin: 0; padding: 10px; min-height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; touch-action: none;
        }

        /* Top Progress */
        .level-slider { display: flex; gap: 8px; overflow-x: auto; width: 95vw; padding: 10px 0; scrollbar-width: none; }
        .level-slider::-webkit-scrollbar { display: none; }
        .level-dot {
            min-width: 35px; height: 35px; background: rgba(255,255,255,0.05);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1); font-size: 0.7rem;
        }
        .level-dot.active { border-color: var(--accent); color: var(--accent); background: rgba(0,242,234,0.1); }

        /* Icon Buttons Panel */
        .controls { display: flex; gap: 20px; margin: 15px 0; }
        .btn-icon { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 0.6rem; gap: 5px; cursor: pointer; }
        .btn-icon svg { width: 24px; height: 24px; fill: currentColor; }
        .btn-icon:active { color: var(--accent); }

        /* The Board */
        #puzzle-board { 
            display: grid; gap: 2px; width: 90vw; max-width: 350px; 
            background: #1e293b; padding: 6px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .slot { aspect-ratio: 1/1; background: #0f172a; border-radius: 2px; position: relative; }

        /* Dragging State */
        .tile.dragging {
            position: fixed !important;
            z-index: 10000;
            pointer-events: none;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            border: 2px solid var(--accent) !important;
            transform: scale(1.1); /* Slight growth when picked up */
        }

        /* Piece Tray (The Slider) */
        .tray-container { width: 100vw; background: var(--panel); padding: 20px 0; position: fixed; bottom: 0; border-top: 1px solid #30363d; }
        #piece-tray { 
            display: flex; gap: 15px; overflow-x: scroll; /* Restores sliding */
            padding: 0 30px; scrollbar-width: none; align-items: center; min-height: 90px; 
        }
        #piece-tray::-webkit-scrollbar { display: none; }

        .tile { 
            flex: 0 0 auto; background-repeat: no-repeat; border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Preview Eye Overlay */
        #preview-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; max-width: 340px; aspect-ratio: 1/1; border: 3px solid var(--accent);
            border-radius: 15px; z-index: 5000; background-size: cover;
        }

        .win-btn { position: fixed; top: 45%; padding: 15px 40px; background: var(--accent); color: black; border-radius: 50px; font-weight: bold; display: none; z-index: 6000; border: none; }
    </style>
</head>
<body>

    <div class="level-slider" id="levelSlider"></div>
    
    <div class="controls">
        <button class="btn-icon" onmousedown="showFull(true)" onmouseup="showFull(false)" ontouchstart="showFull(true)" ontouchend="showFull(false)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            PREVIEW
        </button>
        <button class="btn-icon" onclick="initLevel()">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            RESET
        </button>
        <button class="btn-icon" onclick="useHint()">
            <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
            HINT
        </button>
    </div>

    <div id="puzzle-board"></div>

    <div class="tray-container">
        <div id="piece-tray"></div>
    </div>

    <div id="preview-overlay"></div>
    <button id="nextLevelBtn" class="win-btn" onclick="nextLevel()">NEXT STORY →</button>

    <script>
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        const levels = Array.from({length: 12}, (_, i) => i === 0 ? 'image.png' : `image${i + 1}.png`);
        let gridSize = 3;
        let boardWidth = Math.min(window.innerWidth * 0.9, 350);

        function initLevel() {
            const slider = document.getElementById('levelSlider');
            slider.innerHTML = '';
            levels.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `level-dot ${i === currentLevel ? 'active' : ''}`;
                dot.innerText = i + 1;
                slider.appendChild(dot);
            });

            gridSize = currentLevel < 4 ? 3 : (currentLevel < 8 ? 4 : 5);
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('piece-tray');
            const tileSize = boardWidth / gridSize;

            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = ''; tray.innerHTML = '';
            document.getElementById('nextLevelBtn').style.display = 'none';

            for(let i=0; i < gridSize * gridSize; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                board.appendChild(slot);
            }

            let pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.correctIndex = p;
                
                const traySize = boardWidth / 4; 
                tile.style.width = traySize + 'px';
                tile.style.height = traySize + 'px';
                tile.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                tile.style.backgroundSize = `${boardWidth}px ${boardWidth}px`;
                
                let row = Math.floor(p / gridSize), col = p % gridSize;
                tile.style.backgroundPosition = `-${col * tileSize}px -${row * tileSize}px`;

                tile.addEventListener('touchstart', touchStart, {passive: false});
                tile.addEventListener('touchmove', touchMove, {passive: false});
                tile.addEventListener('touchend', touchEnd);
                tray.appendChild(tile);
            });
        }

        let activeTile = null;

        function touchStart(e) { activeTile = e.target; }

        function touchMove(e) {
            if (!activeTile) return;
            e.preventDefault();
            let touch = e.touches[0];
            let tileSize = boardWidth / gridSize;

            activeTile.classList.add('dragging');
            activeTile.style.width = tileSize + 'px';
            activeTile.style.height = tileSize + 'px';
            
            // Offset: 60px above finger to prevent hiding piece
            activeTile.style.left = touch.clientX + 'px';
            activeTile.style.top = (touch.clientY - 60) + 'px';
            activeTile.style.marginLeft = -(tileSize / 2) + 'px';
            activeTile.style.marginTop = -(tileSize / 2) + 'px';
        }

        function touchEnd(e) {
            if (!activeTile) return;
            activeTile.classList.remove('dragging');
            
            let touch = e.changedTouches[0];
            activeTile.style.display = 'none';
            // Check target relative to the offset piece position
            let target = document.elementFromPoint(touch.clientX, touch.clientY - 60);
            activeTile.style.display = 'block';

            let slot = target ? target.closest('.slot') : null;

            if (slot && slot.children.length === 0) {
                activeTile.style.position = 'static';
                activeTile.style.width = '100%';
                activeTile.style.height = '100%';
                activeTile.style.margin = '0';
                slot.appendChild(activeTile);
                checkWin();
            } else {
                activeTile.style.position = 'static';
                activeTile.style.margin = '0';
                const traySize = boardWidth / 4;
                activeTile.style.width = traySize + 'px';
                activeTile.style.height = traySize + 'px';
                document.getElementById('piece-tray').appendChild(activeTile);
            }
            activeTile = null;
        }

        function checkWin() {
            const slots = document.querySelectorAll('.slot');
            let correct = 0, filled = 0;
            slots.forEach((s, i) => {
                if(s.children.length > 0) {
                    filled++;
                    if(parseInt(s.firstChild.dataset.correctIndex) === i) correct++;
                }
            });
            if(filled === gridSize * gridSize && correct === filled) {
                confetti();
                document.getElementById('nextLevelBtn').style.display = 'block';
            }
        }

        function showFull(show) {
            const over = document.getElementById('preview-overlay');
            over.style.backgroundImage = `url('./${levels[currentLevel]}')`;
            over.style.display = show ? 'block' : 'none';
        }

        function useHint() {
            const trayPieces = document.querySelectorAll('#piece-tray .tile');
            if (trayPieces.length === 0) return;
            const piece = trayPieces[0];
            const targetSlot = document.querySelector(`.slot[data-index="${piece.dataset.correctIndex}"]`);
            targetSlot.style.backgroundColor = "rgba(0, 242, 234, 0.3)";
            setTimeout(() => targetSlot.style.backgroundColor = "#0f172a", 1500);
        }

        function nextLevel() {
            currentLevel++;
            localStorage.setItem('pandaLevel', currentLevel);
            initLevel();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
