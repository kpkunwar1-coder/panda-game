<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="screen-landing" class="screen active">
        <div id="start-hotspot" onclick="startStory()"></div>
    </div>

    <div id="screen-story" class="screen" onclick="nextStorySlide()"></div>

    <div id="screen-map" class="screen">
        <div class="map-container">
            <div class="level-node" onclick="launchLevel(1)">1</div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div id="grid"></div>
        <div class="ui-layer">
            <p>Score: <span id="score-val">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
