<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Adventure</title>
    <style>
        body { background: #000; color: white; text-align: center; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        .game-container { max-width: 500px; margin: auto; position: relative; height: 100vh; background: #1a1a1a; }
        .screen { display: none; width: 100%; height: 100%; position: relative; }
        .active { display: block; }
        img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* The Invisible Hotspot for the Infused Buttons */
        .click-zone {
            position: absolute;
            bottom: 2%;
            left: 5%; 
            width: 90%; 
            height: 18%; 
            cursor: pointer;
            z-index: 100;
        }

        /* Map Level Markers */
        .level-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #FFD700;
            border: 2px solid white;
            border-radius: 50%;
            color: black;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px gold;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .level-node:hover { transform: scale(1.2); }

        /* Page Turn Animation */
        .page-slide { animation: slideIn 0.5s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="story-view" class="screen active">
            <img id="story-img" src="assets/backgrounds/ui_landing_page_start.png">
            <div id="story-click-zone" class="click-zone" onclick="handleStoryClick()"></div>
        </div>

        <div id="map-view" class="screen">
            <img src="assets/map/map_saga_background.png">
            
            <div class="level-node" style="bottom: 12%; left: 48%;" onclick="startLevel(1)">1</div>
            <div class="level-node" style="bottom: 18%; left: 32%;" onclick="startLevel(2)">2</div>
            <div class="level-node" style="bottom: 25%; left: 22%;" onclick="startLevel(3)">3</div>
            <div class="level-node" style="bottom: 35%; left: 30%;" onclick="startLevel(4)">4</div>
            <div class="level-node" style="bottom: 42%; left: 45%;" onclick="startLevel(5)">5</div>
            <div class="level-node" style="bottom: 50%; left: 60%;" onclick="startLevel(6)">6</div>
            <div class="level-node" style="bottom: 60%; left: 55%;" onclick="startLevel(7)">7</div>
            <div class="level-node" style="bottom: 68%; left: 40%;" onclick="startLevel(8)">8</div>
            <div class="level-node" style="bottom: 75%; left: 25%;" onclick="startLevel(9)">9</div>
            <div class="level-node" style="bottom: 85%; left: 35%;" onclick="startLevel(10)">10</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
