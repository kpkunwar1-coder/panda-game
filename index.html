<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: Mobile Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --secondary: #ff00ff; --bg: #0b0e14; }
        body { 
            font-family: 'Inter', sans-serif; text-align: center; 
            background: radial-gradient(circle at top, #1e293b 0%, #0b0e14 100%);
            color: white; margin: 0; padding: 10px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            touch-action: none; overflow: hidden; /* Prevents page bounce while dragging */
        }

        h1 { font-size: 1.5rem; margin: 10px 0; background: linear-gradient(to right, var(--accent), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* The Board */
        #puzzle-board { 
            display: grid; gap: 2px; width: 92vw; max-width: 360px; 
            background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;
        }
        .slot { aspect-ratio: 1/1; background: rgba(0,0,0,0.3); border-radius: 4px; border: 1px dashed rgba(255,255,255,0.1); }

        /* The Piece Tray */
        #piece-tray { 
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; 
            width: 92vw; max-width: 400px; padding: 15px; min-height: 100px;
            background: rgba(255,255,255,0.05); border-radius: 15px;
        }

        .tile { 
            aspect-ratio: 1/1; border-radius: 4px; cursor: grab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: none;
            background-repeat: no-repeat; z-index: 10;
        }

        .next-btn { margin-top: 20px; padding: 15px 40px; background: linear-gradient(45deg, var(--accent), var(--secondary)); color: white; border: none; border-radius: 50px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <h1>🐼 PANDA QUEST</h1>
    <div id="status-msg" style="color: var(--accent); margin-bottom: 10px;">Drag the pieces to the slots!</div>

    <div id="puzzle-board"></div>
    <div id="piece-tray"></div>

    <button id="nextLevelBtn" class="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>

    <script>
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let gridSize = 3;
        const levels = Array.from({length: 50}, (_, i) => `image${i + 1}.png`);

        function initLevel() {
            gridSize = currentLevel < 4 ? 3 : (currentLevel < 8 ? 4 : 5);
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('piece-tray');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = ''; tray.innerHTML = '';
            document.getElementById('nextLevelBtn').style.display = 'none';

            // Create empty slots
            for(let i=0; i < gridSize * gridSize; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                board.appendChild(slot);
            }

            // Create shuffled pieces
            let pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.correctIndex = p;
                
                const tileSize = Math.floor(320 / gridSize);
                tile.style.width = tileSize + 'px';
                tile.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                tile.style.backgroundSize = `${gridSize * 100}%`;
                
                let row = Math.floor(p / gridSize), col = p % gridSize;
                let percent = 100 / (gridSize - 1);
                tile.style.backgroundPosition = `${col * percent}% ${row * percent}%`;

                // TOUCH EVENT LISTENERS
                tile.addEventListener('touchstart', touchStart, {passive: false});
                tile.addEventListener('touchmove', touchMove, {passive: false});
                tile.addEventListener('touchend', touchEnd);

                tray.appendChild(tile);
            });
        }

        let activeTile = null;
        let startX, startY;

        function touchStart(e) {
            activeTile = e.target;
            let touch = e.touches[0];
            startX = touch.clientX - activeTile.offsetLeft;
            startY = touch.clientY - activeTile.offsetTop;
            activeTile.style.zIndex = "1000";
        }

        function touchMove(e) {
            if (!activeTile) return;
            e.preventDefault();
            let touch = e.touches[0];
            activeTile.style.position = 'fixed';
            activeTile.style.left = (touch.clientX - activeTile.offsetWidth / 2) + 'px';
            activeTile.style.top = (touch.clientY - activeTile.offsetHeight / 2) + 'px';
        }

        function touchEnd(e) {
            if (!activeTile) return;
            let touch = e.changedTouches[0];
            activeTile.style.display = 'none'; // Temporarily hide to find what's under it
            let dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
            activeTile.style.display = 'block';

            let slot = dropTarget ? dropTarget.closest('.slot') : null;

            if (slot && slot.children.length === 0) {
                activeTile.style.position = 'static';
                activeTile.style.width = '100%';
                slot.appendChild(activeTile);
                checkWin();
            } else {
                // Send back to tray
                activeTile.style.position = 'static';
                activeTile.style.width = Math.floor(320 / gridSize) + 'px';
                document.getElementById('piece-tray').appendChild(activeTile);
            }
            activeTile.style.zIndex = "10";
            activeTile = null;
        }

        function checkWin() {
            const slots = document.querySelectorAll('.slot');
            let correct = 0, filled = 0;
            slots.forEach((s, i) => {
                if(s.children.length > 0) {
                    filled++;
                    if(parseInt(s.firstChild.dataset.correctIndex) === i) correct++;
                }
            });
            if(filled === gridSize * gridSize && correct === filled) {
                confetti();
                document.getElementById('nextLevelBtn').style.display = 'block';
            }
        }

        function nextLevel() {
            currentLevel++;
            localStorage.setItem('pandaLevel', currentLevel);
            initLevel();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
