<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Jigsaw Challenge</title>
    <style>
        /* Modern Dark Theme for Reels Audience */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background: #000000; 
            color: white; 
            margin: 0; 
            padding: 20px;
            overflow-x: hidden;
        }

        h1 { color: #ffffff; font-size: 24px; margin-bottom: 5px; }
        .stats { margin-bottom: 20px; font-size: 18px; color: #a0a0a0; }
        
        /* The Board - This scales to fit phone screens */
        #puzzle-board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 4px; 
            width: 90vw; 
            max-width: 360px; 
            margin: 0 auto;
            background: #262626;
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .tile { 
            aspect-ratio: 1 / 1; 
            background-image: url('image.png'); /* THIS LOOKS FOR YOUR PNG */
            background-size: 90vw 90vw; 
            cursor: pointer;
            border-radius: 4px;
            touch-action: none; 
        }

        /* Responsive slicing for larger phones */
        @media (min-width: 360px) { .tile { background-size: 360px 360px; } }

        /* Background positions to slice the image */
        .p0 { background-position: 0 0; } .p1 { background-position: 50% 0; } .p2 { background-position: 100% 0; }
        .p3 { background-position: 0 50%; } .p4 { background-position: 50% 50%; } .p5 { background-position: 100% 50%; }
        .p6 { background-position: 0 100%; } .p7 { background-position: 50% 100%; } .p8 { background-position: 100% 100%; }

        button {
            margin-top: 30px; 
            padding: 15px 40px; 
            font-size: 18px;
            background: #0095f6; /* Instagram Blue */
            color: #fff; 
            border: none; 
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.2s;
        }

        button:active { transform: scale(0.95); background: #0077c7; }
    </style>
</head>
<body>

    <h1>🐼 Panda Jigsaw</h1>
    <div class="stats">Moves: <span id="moves">0</span></div>
    
    <div id="puzzle-board"></div>

    <button onclick="shuffle()">SHUFFLE & PLAY</button>

    <script>
        let moves = 0;
        let selectedTile = null;
        const board = document.getElementById('puzzle-board');
        const pieces = [0,1,2,3,4,5,6,7,8];
        
        function createBoard() {
            board.innerHTML = '';
            pieces.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = `tile p${p}`;
                div.dataset.index = i;
                
                // Click-to-Swap Logic (Works best for both mobile and desktop)
                div.onclick = () => handleTileClick(div);
                
                board.appendChild(div);
            });
        }

        function handleTileClick(tile) {
            if (selectedTile === null) {
                selectedTile = tile;
                tile.style.outline = "3px solid white";
                tile.style.zIndex = "10";
            } else {
                swapTiles(selectedTile, tile);
                selectedTile = null;
            }
        }

        function swapTiles(tile1, tile2) {
            let idx1 = tile1.dataset.index;
            let idx2 = tile2.dataset.index;
            
            let val1 = pieces[idx1];
            let val2 = pieces[idx2];
            
            pieces[idx1] = val2;
            pieces[idx2] = val1;
            
            moves++;
            document.getElementById('moves').innerText = moves;
            createBoard();
            checkWin();
        }

        function checkWin() {
            if (pieces.every((p, i) => p === i) && moves > 0) {
                setTimeout(() => alert(`Victory! You solved it in ${moves} moves! 🐼`), 500);
            }
        }

        function shuffle() {
            pieces.sort(() => Math.random() - 0.5);
            moves = 0;
            document.getElementById('moves').innerText = moves;
            createBoard();
        }

        // Initialize the game
        createBoard();
    </script>
</body>
</html>
