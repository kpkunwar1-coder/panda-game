<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pandu Panda: The Saga</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #ff85a1; --bg: #fdfbfb; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden;
        }

        .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }

        /* --- HOME SCREEN --- */
        #screen-home { 
            background: url('hero-start.png') center/cover no-repeat; 
        }
        
        /* ADJUST THESE VALUES to move the button exactly over your image's text */
        .btn-hitbox {
            position: absolute; 
            top: 55%; /* Move up/down */
            width: 180px; 
            height: 70px;
            cursor: pointer;
            animation: bounce 2s infinite ease-in-out;
            border: none;
            background: transparent;
            /* border: 2px solid red; /* UNCOMMENT THIS TO SEE THE HITBOX WHILE TESTING */
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* --- STORY SCREEN --- */
        #screen-story { background: #fff; text-align: center; }
        .story-img { 
            width: 85vw; max-width: 350px; aspect-ratio: 2/3; 
            border-radius: 20px; border: 6px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-size: cover; margin-bottom: 20px;
        }

        /* --- GAME SCREEN --- */
        #screen-game { 
            background: linear-gradient(rgba(255,255,255,0.75), rgba(255,255,255,0.75)), url('story-1-4.png') center/cover;
            backdrop-filter: blur(5px);
        }
        #puzzle-board { 
            display: grid; gap: 6px; width: 90vw; max-width: 380px; 
            background: white; padding: 12px; border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        .tile { aspect-ratio: 1/1; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
        .tile.selected { border-color: var(--accent); transform: scale(1.05); }
    </style>
</head>
<body>

    <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>
    <audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <div id="screen-home" class="screen active">
        <button class="btn-hitbox" onclick="startToStory()"></button>
    </div>

    <div id="screen-story" class="screen">
        <div class="story-img" id="current-story-img"></div>
        <button style="padding:15px 40px; border-radius:30px; border:none; background:var(--accent); color:white; font-weight:bold;" onclick="handleStoryNext()" id="story-btn">NEXT</button>
    </div>

    <div id="screen-game" class="screen">
        <div id="puzzle-board"></div>
    </div>

    <script>
        let level = parseInt(localStorage.getItem('pandaLevel')) || 1;
        let storyIndex = 1;
        
        // Puzzles images based on level
        const gameImages = ['image.png', 'image2.png', 'image3.png', 'image4.png', 'image5.png'];
        
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startToStory() {
            document.getElementById('bg-music').play().catch(() => {});
            showScreen('screen-story');
            updateStorySlide();
        }

        function updateStorySlide() {
            document.getElementById('current-story-img').style.backgroundImage = `url('story-1-${storyIndex}.png')`;
            document.getElementById('story-btn').innerText = storyIndex === 4 ? "FIX THE MAP!" : "NEXT";
        }

        function handleStoryNext() {
            if (storyIndex < 4) { storyIndex++; updateStorySlide(); } 
            else { showScreen('screen-game'); initGame(); }
        }

        function initGame() {
            // FIX: Now using image3.png for the first puzzle as requested
            let currentImg = level === 1 ? 'image3.png' : gameImages[(level - 1) % gameImages.length];
            let grid = level <= 2 ? 3 : 4;
            
            const board = document.getElementById('puzzle-board');
            board.style.gridTemplateColumns = `repeat(${grid}, 1fr)`;
            board.innerHTML = '';
            
            let tiles = Array.from({length: grid * grid}, (_, i) => i);
            tiles.sort(() => Math.random() - 0.5);

            tiles.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'tile';
                div.style.backgroundImage = `url('${currentImg}')`;
                div.style.backgroundSize = `360px 360px`;
                let r = Math.floor(val/grid), c = val%grid;
                div.style.backgroundPosition = `-${c*(360/grid)}px -${r*(360/grid)}px`;
                div.onclick = () => {
                    document.getElementById('snd-pop').play();
                    // Basic swap logic here...
                };
                board.appendChild(div);
            });
        }
    </script>
</body>
</html>
