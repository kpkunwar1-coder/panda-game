<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Adventure</title>
    <style>
        /* CSS: This is the design part */
        body { background: #000; color: white; text-align: center; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .game-container { max-width: 500px; margin: auto; position: relative; height: 100vh; background: #1a1a1a; }
        .screen { display: none; width: 100%; height: 100%; position: relative; }
        .active { display: block; }
        img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Level Hitboxes */
        .hitbox { position: absolute; cursor: pointer; z-index: 100; }

        /* Puzzle Styling */
        #puzzle-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; background: rgba(0, 0, 0, 0.85); border: 4px solid #4e2e1a;
            border-radius: 20px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .bamboo-row { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .bamboo-seg {
            width: 60px; height: 100px; background: #7ca852; border: 3px solid #5d7e3e;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #fff; cursor: pointer; text-shadow: 2px 2px 4px #000;
        }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #d4a373; color: #4e2e1a; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="story-view" class="screen active">
            <img id="story-img" src="assets/backgrounds/ui_landing_page_start.png">
            <div class="hitbox" style="bottom:2%; left:10%; width:80%; height:18%;" onclick="advanceStory()"></div>
        </div>

        <div id="map-view" class="screen">
            <img src="assets/map/map_saga_background1.jpg">
            <div class="hitbox" style="bottom: 2%; left: 42%; width: 15%; height: 8%;" onclick="startLevel(1)"></div>
            <div class="hitbox" style="bottom: 12%; left: 48%; width: 15%; height: 7%;" onclick="startLevel(2)"></div>
            </div>

        <div id="puzzle-view" class="screen">
            <img src="assets/backgrounds/bg_mystical_gates.png">
            <div class="back-btn" onclick="exitLevel()">MAP</div>
            <div id="puzzle-ui">
                <h2>BAMBOO LOCK</h2>
                <p>Align the numbers to open the gate!</p>
                <div class="bamboo-row" id="bamboo-container">
                    </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
