<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; }
        
        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;
            height: 100vh; touch-action: none; overflow: hidden;
        }

        /* 1. TOP NAV & SLIDER */
        header { width: 100%; background: #161b22; padding: 10px 0; border-bottom: 1px solid #30363d; }
        .level-slider {
            display: flex; gap: 10px; overflow-x: auto; padding: 0 15px; scrollbar-width: none;
        }
        .level-dot {
            min-width: 35px; height: 35px; background: #21262d; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
            border: 1px solid #30363d; color: #8b949e;
        }
        .level-dot.active { border-color: var(--accent); color: var(--accent); background: rgba(0,242,234,0.1); }

        /* 2. GAME CONTROLS bar */
        .controls { display: flex; justify-content: space-around; width: 100%; padding: 12px 0; background: #0b0e14; }
        .btn-tool { 
            background: transparent; border: none; color: #8b949e; font-size: 0.75rem;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .btn-tool svg { width: 20px; height: 20px; fill: currentColor; }

        /* 3. THE WORKSPACE (The Canvas) */
        #workspace {
            flex: 1; width: 100%; position: relative; display: flex;
            align-items: center; justify-content: center; background: #0d1117;
        }
        #puzzle-board { 
            position: relative; width: 90vw; max-width: 350px; aspect-ratio: 1/1;
            background: rgba(255,255,255,0.03); border-radius: 4px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        /* 4. BOTTOM TRAY */
        .tray-container {
            width: 100%; background: #161b22; padding: 25px 0;
            border-top: 1px solid #30363d;
        }
        #piece-tray { 
            display: flex; gap: 20px; overflow-x: auto; padding: 0 30px; scrollbar-width: none;
        }

        /* 🧩 JIGSAW PIECE STYLE */
        .tile { 
            flex: 0 0 auto; aspect-ratio: 1/1; background-repeat: no-repeat;
            clip-path: url(#jigsaw-piece); -webkit-clip-path: url(#jigsaw-piece);
            filter: drop-shadow(0px 0px 1px rgba(255,255,255,0.3));
        }

        /* 👆 FINGER OFFSET DRAGGING */
        .dragging {
            position: fixed !important; z-index: 9999;
            transform: scale(1.3) translateY(-70px) !important; /* Lifts piece above thumb */
            pointer-events: none;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        #nextLevelBtn {
            position: fixed; top: 40%; padding: 15px 40px; background: var(--accent);
            color: black; border-radius: 50px; font-weight: bold; display: none; z-index: 10000;
        }

        #preview-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; max-width: 320px; aspect-ratio: 1/1; border: 2px solid var(--accent);
            z-index: 5000; background-size: cover; border-radius: 8px;
        }
    </style>
</head>
<body>

    <svg width="0" height="0">
      <defs>
        <clipPath id="jigsaw-piece" clipPathUnits="objectBoundingBox">
          <path d="M0.25,0 C0.25,0.12,0.35,0.15,0.5,0.15 C0.65,0.15,0.75,0.12,0.75,0 L1,0 L1,0.25 C0.88,0.25,0.85,0.35,0.85,0.5 C0.85,0.65,0.88,0.75,1,0.75 L1,1 L0.75,1 C0.75,0.88,0.65,0.85,0.5,0.85 C0.35,0.85,0.25,0.88,0.25,1 L0,1 L0,0.75 C0.12,0.75,0.15,0.65,0.15,0.5 C0.15,0.35,0.12,0.25,0,0.25 L0,0 Z"></path>
        </clipPath>
      </defs>
    </svg>

    <header>
        <div class="level-slider" id="levelSlider"></div>
    </header>

    <div class="controls">
        <button class="btn-tool" onmousedown="showFull(true)" onmouseup="showFull(false)" ontouchstart="showFull(true)" ontouchend="showFull(false)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            PREVIEW
        </button>
        <button class="btn-tool" onclick="initLevel()">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            RESET
        </button>
        <button class="btn-tool" onclick="useHint()">
            <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
            HINT
        </button>
    </div>

    <div id="workspace">
        <div id="puzzle-board"></div>
    </div>

    <div class="tray-container">
        <div id="piece-tray"></div>
    </div>

    <div id="preview-overlay"></div>
    <button id="nextLevelBtn" onclick="nextLevel()">NEXT LEVEL →</button>

    <script>
        let currentLevel = parseInt(localStorage.getItem('pandaLevel')) || 0;
        let gridSize = 3;
        const levels = Array.from({length: 12}, (_, i) => i === 0 ? 'image.png' : `image${i + 1}.png`);

        function initLevel() {
            const slider = document.getElementById('levelSlider');
            slider.innerHTML = '';
            levels.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `level-dot ${i === currentLevel ? 'active' : ''}`;
                dot.innerText = i + 1;
                slider.appendChild(dot);
            });

            gridSize = currentLevel < 4 ? 3 : (currentLevel < 8 ? 4 : 5);
            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('piece-tray');
            const boardWidth = Math.min(window.innerWidth * 0.9, 350);
            const tileSize = boardWidth / gridSize;
            
            board.style.width = boardWidth + 'px';
            board.innerHTML = ''; tray.innerHTML = '';
            document.getElementById('nextLevelBtn').style.display = 'none';

            let pieces = Array.from({length: gridSize * gridSize}, (_, i) => i);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach(p => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.correctIndex = p;
                
                // Tray size
                const traySize = Math.floor(boardWidth / 3.5);
                tile.style.width = traySize + 'px';
                tile.style.height = traySize + 'px';
                tile.style.backgroundImage = `url('./${levels[currentLevel]}')`;
                tile.style.backgroundSize = `${boardWidth}px ${boardWidth}px`;
                
                let row = Math.floor(p / gridSize);
                let col = p % gridSize;
                tile.style.backgroundPosition = `-${col * tileSize}px -${row * tileSize}px`;

                tile.addEventListener('touchstart', touchStart, {passive: false});
                tile.addEventListener('touchmove', touchMove, {passive: false});
                tile.addEventListener('touchend', touchEnd);
                tray.appendChild(tile);
            });
        }

        let activeTile = null;

        function touchStart(e) { activeTile = e.target; }

        function touchMove(e) {
            if (!activeTile) return;
            e.preventDefault();
            let touch = e.touches[0];
            const boardWidth = Math.min(window.innerWidth * 0.9, 350);
            const tileSize = boardWidth / gridSize;

            activeTile.classList.add('dragging');
            activeTile.style.width = (tileSize * 1.2) + 'px';
            activeTile.style.height = (tileSize * 1.2) + 'px';
            activeTile.style.left = touch.clientX + 'px';
            activeTile.style.top = touch.clientY + 'px';
            activeTile.style.marginLeft = -(tileSize * 0.6) + 'px';
            activeTile.style.marginTop = -(tileSize * 0.6) + 'px';
        }

        function touchEnd(e) {
            if (!activeTile) return;
            activeTile.classList.remove('dragging');
            activeTile.style.marginLeft = "0"; activeTile.style.marginTop = "0";

            let touch = e.changedTouches[0];
            const board = document.getElementById('puzzle-board');
            const boardRect = board.getBoundingClientRect();
            const boardWidth = boardRect.width;
            const tileSize = boardWidth / gridSize;

            // Correct for finger offset (checking 70px above touch)
            const dropX = touch.clientX - boardRect.left;
            const dropY = (touch.clientY - 70) - boardRect.top;

            const p = parseInt(activeTile.dataset.correctIndex);
            const correctX = (p % gridSize) * tileSize;
            const correctY = Math.floor(p / gridSize) * tileSize;

            const distance = Math.sqrt(Math.pow(dropX - correctX, 2) + Math.pow(dropY - correctY, 2));

            if (distance < 30) {
                // LOCK IN PLACE
                activeTile.style.position = 'absolute';
                activeTile.style.left = correctX + 'px';
                activeTile.style.top = correctY + 'px';
                activeTile.style.width = tileSize + 'px';
                activeTile.style.height = tileSize + 'px';
                activeTile.style.zIndex = "1";
                activeTile.removeEventListener('touchstart', touchStart);
                activeTile.removeEventListener('touchmove', touchMove);
                activeTile.removeEventListener('touchend', touchEnd);
                board.appendChild(activeTile);
                if(window.navigator.vibrate) window.navigator.vibrate(30);
                checkWin();
            } else {
                // FREE PARK or RETURN
                if (dropX > -20 && dropX < boardWidth && dropY > -20 && dropY < boardWidth) {
                    activeTile.style.position = 'absolute';
                    activeTile.style.left = (dropX - tileSize/2) + 'px';
                    activeTile.style.top = (dropY - tileSize/2) + 'px';
                    board.appendChild(activeTile);
                } else {
                    activeTile.style.position = 'static';
                    const traySize = Math.floor(boardWidth / 3.5);
                    activeTile.style.width = traySize + 'px';
                    activeTile.style.height = traySize + 'px';
                    document.getElementById('piece-tray').appendChild(activeTile);
                }
            }
            activeTile = null;
        }

        function checkWin() {
            const boardPieces = document.querySelectorAll('#puzzle-board .tile');
            if (boardPieces.length === gridSize * gridSize) {
                let allLocked = true;
                boardPieces.forEach(tile => { if(tile.style.position !== 'absolute') allLocked = false; });
                if(allLocked) {
                    confetti();
                    document.getElementById('nextLevelBtn').style.display = 'block';
                }
            }
        }

        function showFull(show) {
            const over = document.getElementById('preview-overlay');
            over.style.backgroundImage = `url('./${levels[currentLevel]}')`;
            over.style.display = show ? 'block' : 'none';
        }

        function useHint() {
            const trayPieces = document.querySelectorAll('#piece-tray .tile');
            if (trayPieces.length === 0) return;
            alert("Try dropping the piece near its correct spot on the board!");
        }

        function nextLevel() {
            currentLevel++;
            localStorage.setItem('pandaLevel', currentLevel);
            initLevel();
        }

        window.onload = initLevel;
    </script>
</body>
</html>
