<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panda Quest: The Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --accent: #00f2ea; --bg: #0b0e14; --panel: #161b22; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }

        /* Top Header */
        .header { width: 100%; background: #000; padding: 10px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-around; align-items: center; }
        .level-badge { background: var(--accent); color: black; padding: 5px 15px; border-radius: 20px; font-weight: 900; font-size: 0.9rem; }
        #heart-display { font-size: 1.2rem; letter-spacing: 3px; }

        /* Stats Bar */
        .stats-bar { display: flex; justify-content: space-around; width: 100%; max-width: 400px; margin: 15px 0; }
        .stat-box { text-align: center; background: var(--panel); padding: 8px 15px; border-radius: 10px; border: 1px solid #333; min-width: 90px; }
        .stat-label { font-size: 0.6rem; color: #94a3b8; display: block; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--accent); }

        /* Board */
        #puzzle-board { 
            display: grid; gap: 4px; width: 92vw; max-width: 380px; 
            background: #1e293b; padding: 10px; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .tile { 
            aspect-ratio: 1/1; background-repeat: no-repeat; border-radius: 4px;
            transition: transform 0.2s, border 0.2s; cursor: pointer; border: 2px solid transparent;
        }
        .tile.selected { border: 2px solid var(--accent); transform: scale(1.05); z-index: 10; box-shadow: 0 0 15px var(--accent); }

        /* Story UI */
        #start-modal { position: fixed; inset: 0; background: rgba(11, 14, 20, 0.95); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #msg-bubble { background: white; color: black; padding: 15px; border-radius: 15px; margin: 0 40px 20px; font-weight: bold; position: relative; max-width: 280px; text-align: center; }
        #preview-img { width: 150px; height: 150px; border: 3px solid var(--accent); border-radius: 12px; margin-bottom: 20px; background-size: cover; }
        .btn-play { padding: 15px 50px; background: var(--accent); color: #000; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-modal">
        <div id="msg-bubble">Hey! Let's get started.</div>
        <div id="preview-img"></div>
        <button class="btn-play" onclick="closeModal()">GO!</button>
    </div>

    <div class="header">
        <div class="level-badge">LEVEL <span id="current-lvl-display">1</span></div>
        <div id="heart-display">❤️❤️❤️❤️❤️</div>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <span class="stat-label">MOVES LEFT</span>
            <span id="moves-left" class="stat-value">--</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">TILES</span>
            <span id="tile-count" class="stat-value">--</span>
        </div>
    </div>

    <div id="puzzle-board"></div>

    <audio id="snd-move" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="snd-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script>
        // --- GAME STATE ---
        let level = parseInt(localStorage.getItem('pandaLevel')) || 1;
        // The tutorial only happens once ever (at level 1)
        let isWarmupDone = level > 1; 

        // Difficulty Tuning
        let grid = 3; 
        if (level === 1 && !isWarmupDone) grid = 2; // Only Level 1 starts with 2x2
        else if (level < 3) grid = 3;
        else if (level < 6) grid = 4;
        else grid = 5; // Harder levels get a 5x5 grid!

        let moveLimit = grid * 10;
        let currentMoves = moveLimit;

        // Image Mapping (Matches your naming image.png, image2.png, etc.)
        const images = ['image.png', 'image2.png', 'image3.png', 'image4.png', 'image5.png'];
        const stories = [
            "Welcome! I'm Pabu. Let's fix this first photo!",
            "The forest is getting thicker. Stay focused!",
            "Look! The ancient ruins. This one is tricky.",
            "Almost there! The Great Bamboo Falls are ahead.",
            "You're a master! The final piece of the map!"
        ];

        let currentImg = '';
        let tiles = [];
        let firstSelection = null;

        function init() {
            // Pick image based on level
            let imgIdx = (level - 1) % images.length;
            currentImg = `./${images[imgIdx]}`;
            
            document.getElementById('current-lvl-display').innerText = level;
            document.getElementById('moves-left').innerText = currentMoves;
            document.getElementById('tile-count').innerText = `${grid}x${grid}`;
            document.getElementById('msg-bubble').innerText = stories[imgIdx] || "You're doing great!";
            document.getElementById('preview-img').style.backgroundImage = `url('${currentImg}')`;

            tiles = Array.from({length: grid * grid}, (_, i) => i);
            shuffle();
            render();
        }

        function shuffle() {
            if (level === 1 && !isWarmupDone) {
                [tiles[0], tiles[1]] = [tiles[1], tiles[0]]; // Simple 1-move tutorial
            } else {
                tiles.sort(() => Math.random() - 0.5);
            }
        }

        function render() {
            const board = document.getElementById('puzzle-board');
            board.style.gridTemplateColumns = `repeat(${grid}, 1fr)`;
            board.innerHTML = '';
            const size = 360;

            tiles.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = 'tile' + (firstSelection === i ? ' selected' : '');
                div.style.backgroundImage = `url('${currentImg}')`;
                div.style.backgroundSize = `${size}px ${size}px`;
                let r = Math.floor(val / grid), c = val % grid;
                div.style.backgroundPosition = `-${c * (size/grid)}px -${r * (size/grid)}px`;
                div.onclick = () => swap(i);
                board.appendChild(div);
            });
        }

        function swap(idx) {
            if (firstSelection === null) {
                firstSelection = idx;
                render();
            } else {
                if (firstSelection !== idx) {
                    [tiles[firstSelection], tiles[idx]] = [tiles[idx], tiles[firstSelection]];
                    currentMoves--;
                    document.getElementById('snd-move').play();
                    if(window.navigator.vibrate) window.navigator.vibrate(15);
                }
                firstSelection = null;
                document.getElementById('moves-left').innerText = currentMoves;
                render();
                check();
            }
        }

        function check() {
            if (tiles.every((v, i) => v === i)) {
                document.getElementById('snd-win').play();
                confetti();

                if (level === 1 && !isWarmupDone) {
                    // One-time tutorial skip logic
                    isWarmupDone = true;
                    setTimeout(() => {
                        grid = 3; // Immediately jump to 3x3
                        currentMoves = 30;
                        init();
                    }, 1500);
                } else {
                    // Next Level
                    setTimeout(() => {
                        level++;
                        localStorage.setItem('pandaLevel', level);
                        location.reload();
                    }, 2000);
                }
            } else if (currentMoves <= 0) {
                alert("Out of moves! Heart lost.");
                location.reload();
            }
        }

        function closeModal() { document.getElementById('start-modal').style.display = 'none'; }
        window.onload = init;
    </script>
</body>
</html>
