<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Adventure</title>
    <style>
        body { background: #000; color: white; text-align: center; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        .game-container { max-width: 500px; margin: auto; position: relative; height: 100vh; background: #1a1a1a; }
        .screen { display: none; width: 100%; height: 100%; position: relative; }
        .active { display: block; }
        img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* The Invisible Start Hotspot over the Bamboo Button */
        #start-hotspot {
            position: absolute;
            bottom: 3%;      /* Adjusted for the bamboo button position */
            left: 10%; 
            width: 80%; 
            height: 18%; 
            cursor: pointer;
            z-index: 100;
            /* border: 2px solid lime; */ /* Uncomment to see the clickable area */
        }

        .btn-next {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: #FFD700;
            color: #333;
            border: 3px solid white;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 101;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="story-view" class="screen active">
            <img id="story-img" src="assets/backgrounds/ui_landing_page_start.jpg" alt="Pandu's World">
            
            <div id="start-hotspot" onclick="beginAdventure()"></div>
            
            <button id="next-button" class="btn-next" onclick="advanceStory()" style="display:none;">CONTINUE...</button>
        </div>

        <div id="map-view" class="screen">
            <img src="assets/map/map_saga_background.png">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
