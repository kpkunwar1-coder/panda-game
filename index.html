<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Adventure</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; margin: 0; }
        .game-container { max-width: 500px; margin: auto; position: relative; background: #000; min-height: 100vh; }
        .screen { display: none; }
        .active { display: block; }
        img { width: 100%; display: block; }
        .ui-overlay { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 10px; }
        .btn { padding: 15px 25px; background: #FFD700; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
        
        /* Level Hotspot Example */
        #level-target { 
            position: absolute; width: 50px; height: 50px; 
            border: 2px dashed rgba(255,255,255,0.5); /* Hide this later */
            top: 50%; left: 50%; /* We will adjust per level */
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="story-view" class="screen active">
            <img id="story-img" src="assets/backgrounds/ui_landing_page_start.jpg">
            <div class="ui-overlay">
                <button class="btn" onclick="advanceStory()">CONTINUE</button>
            </div>
        </div>

        <div id="map-view" class="screen">
            <img src="assets/map/map_saga_background.png">
            <div class="ui-overlay" style="flex-wrap: wrap; bottom: 10px;">
                <button class="btn" onclick="loadLevel(1)">1</button>
                <button class="btn" onclick="loadLevel(9)">9</button>
            </div>
        </div>

        <div id="puzzle-view" class="screen">
            <h2 id="level-title">Find the Object!</h2>
            <div style="position: relative;">
                <img id="puzzle-img" src="">
                <div id="level-target" onclick="completeLevel()"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
