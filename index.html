<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandu's Adventure</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; margin: 0; font-family: sans-serif; }
        .game-container { max-width: 500px; margin: auto; position: relative; background: #000; min-height: 100vh; overflow: hidden; }
        .screen { display: none; width: 100%; height: 100%; position: relative; }
        .active { display: block; }
        img { width: 100%; display: block; }

        /* The Invisible Start Hotspot */
        #start-hotspot {
            position: absolute;
            bottom: 5%;      /* Adjusted to sit over the bamboo button */
            left: 15%;        /* Centered width-wise */
            width: 70%;       /* Covers the bamboo area */
            height: 12%;      /* Height of the button graphic */
            cursor: pointer;
            /* background: rgba(255,0,0,0.3); */ /* Uncomment this to see the box while testing! */
        }

        .btn-next {
            position: absolute;
            bottom: 5%;
            padding: 15px 30px;
            background: rgba(0,0,0,0.8);
            color: gold;
            border: 2px solid gold;
            border-radius: 10px;
            cursor: pointer;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="story-view" class="screen active">
            <img id="story-img" src="assets/backgrounds/landing_with_button.jpg">
            
            <div id="start-hotspot" onclick="beginAdventure()"></div>
            
            <button id="next-button" class="btn-next" onclick="advanceStory()" style="display:none;">CONTINUE...</button>
        </div>

        <div id="map-view" class="screen">
            <img src="assets/map/map_saga_background.png">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
